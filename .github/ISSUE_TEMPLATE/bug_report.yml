name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check [Troubleshooting](https://github.com/xattribution/SpoolUp#troubleshooting) first; it covers connecting, buttons that do nothing, voice and Windows warnings.
  - type: input
    id: version
    attributes:
      label: SpoolUp version
      description: Shown in the SpoolUp window's title bar, e.g. "SpoolUp 1.0.0".
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Tablet or phone, and browser
      placeholder: "e.g. iPad Air with Safari, Galaxy Tab S9 with Chrome"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: "e.g. Tapping Landing Gear shows the animation, but the gear doesn't move in the game."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps, if you know them. Which layout and which button?
      placeholder: |
        1. Open the SpoolUp HUD layout
        2. Tap ...
  - type: textarea
    id: log
    attributes:
      label: The last lines of the SpoolUp window's log
      description: Copy them from the SpoolUp window. **Remove your pairing code and IP addresses first.**
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I checked Troubleshooting in the README.
          required: true
        - label: I removed my pairing code and IP addresses from everything above.
          required: true
