# Builds the Windows installer and publishes it as a GitHub Release.
#
#   git tag v1.0.0 && git push origin v1.0.0    build and publish "SpoolUp 1.0.0"
#   Actions tab -> Release -> Run workflow       build only; download it from the run's artifacts
#   ... -> Run workflow with "Publish" ticked     build and publish the version in package.json,
#                                                tagging the commit it ran on
#
# The tag must match "version" in package.json.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release for the version in package.json (creates its v<version> tag)"
        type: boolean
        default: false

permissions:
  contents: write # create the release and upload the installer

jobs:
  build:
    runs-on: windows-latest
    env:
      # ---- Code signing (optional) ----
      # Builds are unsigned until one of these is set up. Unsigned installers work, but
      # Windows SmartScreen shows an "unknown publisher" warning.
      #
      # Option A, a code signing certificate (.pfx) stored in repo secrets:
      #   SIGNING_CERT_PFX_BASE64   the .pfx file, base64-encoded
      #                             (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("cert.pfx")))
      #   SIGNING_CERT_PASSWORD     its password
      SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
      #
      # Option B, SignPath Foundation (free for open source; see CODE_SIGNING.md):
      #   secret   SIGNPATH_API_TOKEN         the CI user's API token from SignPath
      #   variable SIGNPATH_ORGANIZATION_ID   your SignPath organization ID
      #   variable SIGNPATH_PROJECT_SLUG      optional, default "tablet-deck"
      #   variable SIGNPATH_POLICY_SLUG       optional, default "release-signing"
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      #
      # Option C, Azure Artifact Signing, the way Quartermaster's tools/sign.sh signs (jsign
      # against an Artifact Signing account, as an app registration with the Certificate
      # Profile Signer role); the same values as its sign.env:
      #   secret   AZURE_TENANT_ID      the app registration's directory (tenant) ID
      #   secret   AZURE_CLIENT_ID      its application (client) ID
      #   secret   AZURE_CLIENT_SECRET  its client secret
      #   variable TD_SIGN_ENDPOINT     the account's endpoint without https://, e.g. wus2.codesigning.azure.net
      #   variable TD_SIGN_ALIAS        <signing account>/<certificate profile>
      # Only the two build steps that sign see the secrets; this flag just says they're set.
      AZURE_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # RELEASE_TAG is the release this run publishes: the pushed tag, or v<version> when
      # run by hand with "Publish" ticked. Empty for a build-only run.
      - name: Work out the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = ""
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          elseif ("${{ inputs.publish }}" -eq "true") {
            $tag = "v" + (Get-Content package.json -Raw | ConvertFrom-Json).version
            gh release view $tag 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { throw "$tag is already released. Set a new version in package.json first." }
            $global:LASTEXITCODE = 0
          }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Check the tag matches package.json and CHANGELOG.md
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG doesn't match package.json version $version. Update package.json or the tag."
          }
          node scripts/release-notes.js $version > $null
          if ($LASTEXITCODE -ne 0) { throw "Add a '## $version' section to CHANGELOG.md." }

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }

      # ---- Code signing ----
      # Only release runs (RELEASE_TAG set) are signed; build-only runs, such as test builds
      # from a branch, stay unsigned and never send a signing request.
      #
      # ---- Code signing, option A: certificate in repo secrets ----
      # Runs only when SIGNING_CERT_PFX_BASE64 is set. scripts/build.js signs TabletDeck.exe
      # and the native helpers with SIGN_CMD, and Inno Setup signs the installer and
      # uninstaller with it ($f is the file to sign).
      - name: Set up signing (certificate)
        if: env.SIGNING_CERT_PFX_BASE64 != '' && env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          "SIGN_CMD=`"$($signtool.FullName)`" sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f `"$pfx`" /p `"$env:SIGNING_CERT_PASSWORD`" `$f" >> $env:GITHUB_ENV

      # ---- Code signing, option C: Azure Artifact Signing ----
      # Runs only for releases, when AZURE_CLIENT_SECRET is set (and no certificate is).
      # scripts/build.js signs the .exe files with SIGN_CMD and Inno Setup the installer and
      # uninstaller; jsign is pinned by its SHA-256, as in Quartermaster's tools/sign.sh.
      - uses: actions/setup-java@v4
        if: env.AZURE_SIGNING == 'true' && env.SIGNING_CERT_PFX_BASE64 == '' && env.RELEASE_TAG != ''
        with:
          distribution: temurin
          java-version: 17

      - name: Set up signing (Azure Artifact Signing)
        if: env.AZURE_SIGNING == 'true' && env.SIGNING_CERT_PFX_BASE64 == '' && env.RELEASE_TAG != ''
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.TD_SIGN_ENDPOINT }}
          ALIAS: ${{ vars.TD_SIGN_ALIAS }}
        run: |
          if (-not $env:ENDPOINT -or -not $env:ALIAS) { throw "Set the repository variables TD_SIGN_ENDPOINT and TD_SIGN_ALIAS (see the comment at the top of this job)." }
          $jar = Join-Path $env:RUNNER_TEMP "jsign-7.6.jar"
          Invoke-WebRequest "https://github.com/ebourg/jsign/releases/download/7.6/jsign-7.6.jar" -OutFile $jar
          if ((Get-FileHash $jar -Algorithm SHA256).Hash.ToLower() -ne "6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5") { throw "jsign-7.6.jar doesn't match its SHA-256" }
          "SIGN_CMD=java -jar $jar --storetype TRUSTEDSIGNING --keystore $env:ENDPOINT --alias $env:ALIAS --tsaurl http://timestamp.acs.microsoft.com --tsmode RFC3161 `$f" >> $env:GITHUB_ENV

      # A published release is always signed: with no signing set up, stop before building.
      - name: Check the release will be signed
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          if (-not $env:SIGN_CMD -and -not $env:SIGNPATH_API_TOKEN) { throw "Releases are signed: set up code signing first (option C, Azure Artifact Signing: the AZURE_* secrets and TD_SIGN_* variables; see docs/DEVELOPMENT.md)." }

      # The build runs in two stages so SignPath (option B) can sign the app files before
      # they go into the installer, and then the installer itself. Without SignPath the
      # signing steps are skipped; with option A, SIGN_CMD signs everything in the build.
      - name: Build the app files
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npm run build -- --app

      # ---- Code signing, option B: SignPath ----
      # Runs only when SIGNPATH_API_TOKEN is set. The artifact configurations "app" and
      # "installer" in SignPath are copies of .signpath/artifact-configurations/*.xml.
      - name: Upload the app files for signing
        id: unsigned-app
        if: env.SIGNPATH_API_TOKEN != '' && env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v7
        with:
          name: app-unsigned
          path: build/app

      - name: Sign the app files (SignPath)
        if: env.SIGNPATH_API_TOKEN != '' && env.RELEASE_TAG != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'tablet-deck' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          output-artifact-directory: build/app-signed
          # Each request waits for an approver in SignPath; an hour leaves time to approve from a phone.
          wait-for-completion-timeout-in-seconds: 3600

      - name: Use the signed app files
        if: env.SIGNPATH_API_TOKEN != '' && env.RELEASE_TAG != ''
        shell: pwsh
        run: Copy-Item build/app-signed/* build/app -Recurse -Force

      - name: Build the installer
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npm run build -- --installer

      - name: Upload the installer for signing
        id: unsigned-setup
        if: env.SIGNPATH_API_TOKEN != '' && env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v7
        with:
          name: setup-unsigned
          path: dist/*.exe

      - name: Sign the installer (SignPath)
        if: env.SIGNPATH_API_TOKEN != '' && env.RELEASE_TAG != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'tablet-deck' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          output-artifact-directory: dist-signed
          # Each request waits for an approver in SignPath; an hour leaves time to approve from a phone.
          wait-for-completion-timeout-in-seconds: 3600

      # Signing changes the installer, so its checksum (which the app's updater checks) is redone.
      - name: Use the signed installer
        if: env.SIGNPATH_API_TOKEN != '' && env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          Copy-Item dist-signed/*.exe dist -Force
          npm run build -- --checksum

      - uses: actions/upload-artifact@v7
        with:
          name: SpoolUp-Setup
          path: |
            dist/*.exe
            dist/*.sha256

      - name: Publish the release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $setup = "dist/SpoolUp-Setup-$version.exe"
          $hash = (Get-Content "$setup.sha256").Split(" ")[0]
          $changes = (node scripts/release-notes.js $version) -join "`n"
          $notes = @"
          ## What's new

          $changes

          ## Download

          Download **SpoolUp-Setup-$version.exe** below and run it. No Node.js needed. Already have SpoolUp (or Tablet Deck, its old name)? Run it over your copy; your settings are kept. After that it offers updates itself.

          The installer and everything in it are code-signed: its Properties → Digital Signatures shows the publisher. You can also check it against the SHA-256 below. See the [code signing policy](https://github.com/xattribution/SpoolUp/blob/main/CODE_SIGNING.md).

          SHA-256: ``$hash``

          > Fan project. Not affiliated with or endorsed by Cloud Imperium Games.
          "@
          # --target tags this commit when the tag doesn't exist yet (a run by hand).
          gh release create $env:RELEASE_TAG $setup "$setup.sha256" --target "${{ github.sha }}" --title "SpoolUp $version" --notes $notes

  # ---- The Android app (android/, docs/ANDROID.md) ----
  # Builds a signed APK, SpoolUp-<version>.apk, and attaches it to the release the build job
  # just published (or keeps it as a run artifact on a build-only run), with the bundle
  # (.aab) for Google Play as a run artifact. Runs only when the upload key is set up as
  # repository secrets; without them it skips, and the release is Windows only:
  #   ANDROID_KEYSTORE           the keystore file, base64-encoded (base64 -w0 spoolup-upload.jks)
  #   ANDROID_KEYSTORE_PASSWORD  its password
  #   ANDROID_KEY_ALIAS          the key's alias in it
  #   ANDROID_KEY_PASSWORD       the key's password
  android:
    needs: build
    runs-on: ubuntu-latest
    env:
      # Only the build step sees the secrets; this flag just says they're set.
      ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Skip without the Android upload key
        if: env.ANDROID_SIGNING != 'true'
        run: echo "::notice::No Android upload key in the repository secrets (ANDROID_KEYSTORE and friends), so no APK this time. docs/ANDROID.md says how to set it up."

      - uses: actions/checkout@v7
        if: env.ANDROID_SIGNING == 'true'

      - uses: actions/setup-java@v4
        if: env.ANDROID_SIGNING == 'true'
        with:
          distribution: temurin
          java-version: 17

      # The same release as the build job: the pushed tag, or v<version> on a run by hand
      # with "Publish" ticked (the build job has created it by now). Empty for a build-only run.
      - name: Work out the release
        if: env.ANDROID_SIGNING == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          tag=""
          if [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}"
          elif [ "${{ inputs.publish }}" = "true" ]; then tag="v$version"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      # The runner image has the Android SDK; make sure the platform the app builds against is there.
      - name: Set up the Android SDK
        if: env.ANDROID_SIGNING == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build the signed APK and bundle
        if: env.ANDROID_SIGNING == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          SPOOLUP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SPOOLUP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SPOOLUP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export SPOOLUP_KEYSTORE="$RUNNER_TEMP/spoolup-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$SPOOLUP_KEYSTORE"
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease bundleRelease
          rm -f "$SPOOLUP_KEYSTORE"

      - name: Check the signature and name the files
        if: env.ANDROID_SIGNING == 'true'
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/SpoolUp-$VERSION.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/SpoolUp-$VERSION.aab"
          (cd dist && sha256sum "SpoolUp-$VERSION.apk" > "SpoolUp-$VERSION.apk.sha256")

      - uses: actions/upload-artifact@v7
        if: env.ANDROID_SIGNING == 'true'
        with:
          name: SpoolUp-Android
          path: |
            dist/*.apk
            dist/*.apk.sha256
            dist/*.aab

      - name: Attach the APK to the release
        if: env.ANDROID_SIGNING == 'true' && env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "dist/SpoolUp-$VERSION.apk" "dist/SpoolUp-$VERSION.apk.sha256" --clobber
