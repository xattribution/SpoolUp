<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablet Deck</title>
<link rel="stylesheet" href="pi.css">
</head>
<body>
<main>
  <section class="panel" id="action" hidden></section>

  <section class="panel" id="connection" aria-labelledby="connectionHead">
    <h2 id="connectionHead"><span class="slashes">//</span> <span data-t="CONNECTION">CONNECTION</span></h2>
    <p class="link" id="link" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="linkText" data-t="Connecting…">Connecting…</span></p>
    <div class="fields">
      <label class="field"><span data-t="Port">Port</span>
        <input id="port" type="number" min="1" max="65535" inputmode="numeric" placeholder="8765"></label>
      <label class="field"><span data-t="Pairing code">Pairing code</span>
        <input id="code" type="password" autocomplete="off" spellcheck="false" maxlength="64"></label>
    </div>
    <p class="note" id="found"></p>
    <button type="button" id="test" data-t="Test connection">Test connection</button>
    <p class="note" data-t="The code is kept in Stream Deck's settings on this PC, never in exported profiles.">The code is kept in Stream Deck's settings on this PC, never in exported profiles.</p>
  </section>

  <section class="panel" id="options" aria-labelledby="optionsHead">
    <h2 id="optionsHead"><span class="slashes">//</span> <span data-t="OPTIONS">OPTIONS</span></h2>
    <label class="switch"><input type="checkbox" id="follow"><span class="track" aria-hidden="true"></span><span data-t="Tablets follow scenes">Tablets follow scenes</span></label>
    <p class="note" data-t="When the scene changes on Stream Deck, tablets that follow Stream Deck scenes flip to its panels.">When the scene changes on Stream Deck, tablets that follow Stream Deck scenes flip to its panels.</p>
    <label class="switch"><input type="checkbox" id="motion" checked><span class="track" aria-hidden="true"></span><span data-t="Key animations">Key animations</span></label>
    <p class="note" data-t="Press effects on keys and the touch strip. Turn off for still keys.">Press effects on keys and the touch strip. Turn off for still keys.</p>
  </section>
</main>
<script src="pi.js"></script>
</body>
</html>
